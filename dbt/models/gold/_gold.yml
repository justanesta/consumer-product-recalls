version: 2

models:
  - name: dim_date
    description: >
      Generated calendar dimension (ADR 0038 §2; built 2026-06-08 decision). One row per
      calendar day, 1940-01-01..(current year + 2, dynamic). Replaces the inline date_trunc(published_at)
      across the date-grained fct_* models (the C11 wiring step). dim_ prefix per ADR 0038.
    columns:
      - name: date_day
        description: Calendar day — the unique dimension key.
        tests: [not_null, unique]
      - name: year
        tests: [not_null]
      - name: us_fiscal_year
        description: US federal fiscal year (starts Oct 1, labelled by the year it ends in).
        tests: [not_null]

  - name: fct_recalls_by_month
    description: Monthly recall counts per source + 'ALL' rollup (GROUPING SETS). Renamed from recalls_by_month.
    columns:
      - name: period
        tests: [not_null]
      - name: source
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['CPSC', 'FDA', 'USDA', 'NHTSA', 'USCG', 'ALL']
      - name: event_count
        tests: [not_null]

  - name: fct_recalls_by_week
    description: Weekly recall counts per source + 'ALL' rollup. period = ISO week start (Monday).
    columns:
      - name: period
        tests: [not_null]
      - name: source
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['CPSC', 'FDA', 'USDA', 'NHTSA', 'USCG', 'ALL']
      - name: event_count
        tests: [not_null]

  - name: fct_recalls_by_year
    description: Yearly recall counts per source + 'ALL' rollup. period = Jan 1 of the year.
    columns:
      - name: period
        tests: [not_null]
      - name: source
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['CPSC', 'FDA', 'USDA', 'NHTSA', 'USCG', 'ALL']
      - name: event_count
        tests: [not_null]

  - name: fct_recalls_monthly_trend
    description: >
      Monthly recall trend per source over a dense month spine — rolling 3/12-month averages +
      year-over-year % change via window functions.
    columns:
      - name: month
        tests: [not_null]
      - name: source
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['CPSC', 'FDA', 'USDA', 'NHTSA', 'USCG']
      - name: event_count
        tests: [not_null]

  - name: fct_recalls_by_firm
    description: Most-recalled-firms leaderboard (rank over mart_firm_profile). One row per canonical firm.
    columns:
      - name: firm_id
        tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('firm')
                field: firm_id
      - name: event_count
        tests: [not_null]
      - name: event_count_rank
        tests: [not_null]

  - name: fct_recalls_by_classification
    description: >
      Recall counts by classification + risk_level per source + 'ALL' rollup. Source-native enums
      (not conformed cross-source); CPSC/NHTSA NULL = unclassified bucket.
    columns:
      - name: source
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['CPSC', 'FDA', 'USDA', 'NHTSA', 'USCG', 'ALL']
      - name: event_count
        tests: [not_null]

  - name: fct_recall_status
    description: >
      Active/inactive/unknown recall counts per source + 'ALL' rollup. Cross-source signal is
      recall_event.is_active; CPSC/NHTSA carry no status -> 'unknown'.
    columns:
      - name: source
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['CPSC', 'FDA', 'USDA', 'NHTSA', 'USCG', 'ALL']
      - name: status
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['active', 'inactive', 'unknown']
      - name: event_count
        tests: [not_null]

  - name: fct_units_recalled
    description: >
      Units recalled per source × unit_category × month. Per-source the measure differs (NHTSA/USCG
      = vehicles/boats potentially affected; FDA = quantity distributed; USDA = weight recovered), so
      it is NOT cross-source comparable — always filter by source, no 'ALL' rollup. unit_category
      (count/weight/volume/grouping) keeps incommensurable units apart. NHTSA potaff is collapsed to
      one count per recall (repeats across component rows). FDA/USDA come from the C13 quantity parse,
      basis-agnostic: the recall-wide quantity repeats identically across the recall's product rows, so
      units = max(quantity_value) per (recall, category) — a SUM would over-count by the row count (the
      basis-sum/GREATEST logic was replaced 2026-06-09). CPSC remains free-text-only (no parse).
    columns:
      - name: source
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['NHTSA', 'USCG', 'FDA', 'USDA']
      - name: unit_category
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['count', 'weight', 'volume', 'grouping']
      - name: period
        tests: [not_null]
      - name: total_units
        tests: [not_null]

  - name: mart_recall_summary
    description: >
      Denormalized one-row-per-recall serving table (Phase 6e, ADR 0038). The recall_event
      header plus firm rollup (jsonb), product rollup, recall_lifecycle summary, and
      recall_event_history edit flags — feeds GET /recalls (list) and the recall detail page.
    columns:
      - name: recall_event_id
        description: Reused silver surrogate; one row per recall_event.
        tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('recall_event')
                field: recall_event_id
      - name: source
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['CPSC', 'FDA', 'USDA', 'NHTSA', 'USCG']
      - name: published_at
        tests:
          - not_null
      - name: distribution_scope
        description: >
          Distribution breadth — 100% NOT NULL, 4-value enum across all sources (gold-audit 2026-06-14:
          Nationwide 42,183 / Regional 32,255 / Unspecified 11,973 / International 6,967). A clean
          cross-source filter the recalls-api relies on; this test guards the contract so a new value or
          a NULL introduced upstream in silver fails loudly instead of silently breaking the API.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Nationwide', 'Regional', 'Unspecified', 'International']
      - name: firms
        description: jsonb array of {firm_id, name, role, match_confidence} for the recall.
      - name: product_count
        tests:
          - not_null
      - name: search_vector
        description: >
          Recall-grain Postgres FTS tsvector (Option B, gold-audit 2026-06-15) for GET /recalls/search
          (v1.1, API-side). setweight buckets (4, 1:1, so a real brand/product match can outrank a
          narrative-only mention): A=title; B=product_names+primary_firm_name (what/who); C=recall_reason
          (why); D=consequence_of_defect (harm tail). The field->bucket mapping is the gold contract; the API
          tunes the numeric ts_rank_cd weights at query time (no rebuild). GIN-indexed via config(indexes)
          (hash-named, immune to the post_hook-oscillation class). Additive/non-breaking (ADR 0042).

  - name: mart_firm_profile
    description: >
      One row per canonical firm (Phase 6e, ADR 0038) — the cross-source rollup keyed on the 6b
      cluster firm_id. Identity + aliases + recall statistics + per-source SCD-2 sidecar attributes
      (establishment/manufacturer/FDA) as jsonb blocks. Feeds GET /firms/{id} + the firm page.
    columns:
      - name: firm_id
        tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('firm')
                field: firm_id
      - name: canonical_name
        tests:
          - not_null
      - name: total_recalls
        tests:
          - not_null
      - name: recalls_by_source
        description: jsonb object {source -> distinct recall count}.

  - name: mart_product_search
    description: >
      One row per recall_product, denormalized for product search (Phase 6e, ADR 0038). Exact
      identifiers (hin/model/upc, btree) + a stored tsvector search_vector (GIN, Postgres FTS).
      Feeds GET /products/search + keyword search. product-grain upc is NULL today (see model
      header); recall-level UPCs ride in recall_product_upcs.
    columns:
      - name: recall_product_id
        tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('recall_product')
                field: recall_product_id
      - name: recall_event_id
        tests:
          - not_null
      - name: source
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['CPSC', 'FDA', 'USDA', 'NHTSA', 'USCG']
      - name: search_vector
        description: Postgres tsvector over product name/description + recall title + firm name; GIN-indexed.

  - name: fct_recalls_by_geography
    description: >
      Recalls per US state, two lenses (Phase 6e, ADR 0038): 'distribution' (where the product went,
      from recall_distribution_area — FDA+USDA) and 'firm_registration' (where the firm is registered,
      from the SCD-2 sidecars — USDA+USCG+FDA; renamed from 'firm_location' for honesty, C17). A recall
      is counted in EVERY state where any of its firms is registered (industry-footprint reading), so
      per-state counts sum to more than the distinct-recall total; the C18 single-primary-state collapse
      was reverted (it attributed an arbitrary state to 6.6% of recalls). GROUPING SETS emits per-source
      rows + an 'ALL' all-source rollup. State codes constrained to the us_state_abbr seed.
    columns:
      - name: geography_basis
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['distribution', 'firm_registration']
      - name: source
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['CPSC', 'FDA', 'USDA', 'NHTSA', 'USCG', 'ALL']
      - name: state_code
        tests:
          - not_null
      - name: recall_count
        tests:
          - not_null

  - name: fct_recalls_by_country
    description: >
      Recalls per distribution COUNTRY (Phase 7, C12 follow-on) — the country analogue of
      fct_recalls_by_geography's 'distribution' state lens. FDA + USDA only (the sources with a
      distribution field). country_code is ISO-3166-1 alpha-2; 'US' is DERIVED from
      distribution_scope (Nationwide/Regional) + distribution_state_codes (not stored in silver,
      which keeps distribution_country_codes a foreign-only array), foreign codes unnest that array.
      Multi-valued: a US+abroad recall counts once for US and once per foreign country, so per-country
      counts sum to more than the distinct-recall total. GROUPING SETS adds the 'ALL'-source rollup.
    columns:
      - name: source
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['FDA', 'USDA', 'ALL']
      - name: country_code
        tests:
          - not_null
      - name: recall_count
        tests:
          - not_null

  - name: gold_meta
    description: >
      One-row gold-layer rebuild stamp (serving-layer plan R4, ADR 0038 §2). rebuilt_at = the dbt
      run_started_at (UTC), identical across every model in one `dbt build`; read by the serving API
      (recalls-api) to compute a layer-wide ETag / Last-Modified for conditional GET / 304. Granted to
      recalls_readonly by the gold-folder post-hook. schema_version is a manual bump via
      --vars '{gold_schema_version: "2"}'.
    columns:
      - name: rebuilt_at
        description: Gold-layer build timestamp (UTC) — the dbt run start time.
        tests: [not_null]
      - name: schema_version
        description: Manually bumped gold contract version string (default '1').
        tests: [not_null]
