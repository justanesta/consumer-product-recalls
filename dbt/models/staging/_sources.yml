version: 2

sources:
  - name: cpsc
    description: Bronze layer for CPSC (Consumer Product Safety Commission) recalls, loaded by src.extractors.cpsc.CpscExtractor.
    schema: public
    tables:
      - name: cpsc_recalls_bronze
        description: One row per (source_recall_id, content_hash) landed from the CPSC Recall Retrieval Web Services API.
        loaded_at_field: extraction_timestamp
        freshness:
          warn_after: {count: 48, period: hour}
          error_after: {count: 7, period: day}
        columns:
          - name: source_recall_id
            description: CPSC RecallNumber — stable identifier across republications.
            tests:
              - not_null
          - name: content_hash
            description: SHA-256 of canonicalized record payload (ADR 0007). Dedup key.
            tests:
              - not_null
          - name: extraction_timestamp
            description: When the extractor wrote this row.
            tests:
              - not_null
      - name: cpsc_recalls_rejected
        description: Quarantine table for records that failed validation or invariant checks (ADR 0013).
        loaded_at_field: rejected_at

  - name: fda
    description: Bronze layer for FDA iRES enforcement recalls, loaded by src.extractors.fda.FdaExtractor.
    schema: public
    tables:
      - name: fda_recalls_bronze
        description: >
          One row per (source_recall_id, content_hash) landed from the FDA iRES bulk POST API.
          source_recall_id = PRODUCTID (product-level key); recall_event_id = RECALLEVENTID
          (event-level grouping key). Multiple rows per source_recall_id are expected when
          content changes between extraction runs (edit detection per ADR 0007).
        loaded_at_field: extraction_timestamp
        freshness:
          warn_after: {count: 72, period: hour}  # FDA publishes Mon-Fri; 72h covers weekends
          error_after: {count: 7, period: day}
        columns:
          - name: source_recall_id
            description: FDA PRODUCTID — unique product identifier across all FDA recall events.
            tests:
              - not_null
          - name: content_hash
            description: SHA-256 of canonicalized record payload (ADR 0007). Dedup key.
            tests:
              - not_null
          - name: extraction_timestamp
            description: When the extractor wrote this row.
            tests:
              - not_null
      - name: fda_recalls_rejected
        description: Quarantine table for FDA records that failed validation or invariant checks (ADR 0013).
        loaded_at_field: rejected_at
      - name: fda_press_releases_bronze
        description: >
          One row per (source_recall_id, press_release_url) press release, landed by
          src.extractors.fda_press_release.FdaPressReleaseExtractor from the Tier-3 lookup
          GET /search/pressreleaseurls/{eventid} (capture-expansion (b) PR). source_recall_id
          = RECALLEVENTID (the event); M:1 to the recall event. Empty events produce no rows.
          No freshness block — not yet cron-scheduled (Phase 7), and the incremental delta is
          routinely empty, so a freshness gate would false-warn.
        loaded_at_field: extraction_timestamp
        columns:
          - name: source_recall_id
            description: FDA RECALLEVENTID — the event this press release belongs to.
            tests:
              - not_null
          - name: press_release_url
            description: Press-release URL — the second identity field (M:1 to the event).
            tests:
              - not_null
          - name: content_hash
            description: SHA-256 of canonicalized record payload (ADR 0007). Dedup key.
            tests:
              - not_null
          - name: extraction_timestamp
            description: When the extractor wrote this row.
            tests:
              - not_null
      - name: fda_press_releases_rejected
        description: Quarantine table for FDA press-release records that failed validation (ADR 0013).
        loaded_at_field: rejected_at

  - name: usda
    description: Bronze layer for USDA FSIS recalls, loaded by src.extractors.usda.UsdaExtractor.
    schema: public
    tables:
      - name: usda_fsis_recalls_bronze
        description: >
          One row per (source_recall_id, content_hash, langcode) landed from the USDA FSIS
          public recall API. Bilingual: English and Spanish siblings co-exist in bronze
          (langcode column distinguishes). Silver consumes only English (stg_usda_fsis_recalls
          filters langcode='English').
        loaded_at_field: extraction_timestamp
        freshness:
          # USDA recalls publish ad-hoc, averaging ~1/week (per
          # documentation/usda/first_extraction_findings.md sections B-C: 115
          # weekday gaps in 6 months, "one recall at a time"). Multi-week
          # silences are not abnormal; SLA flags pipeline failure, not source
          # quietness.
          warn_after: {count: 14, period: day}
          error_after: {count: 30, period: day}
        columns:
          - name: source_recall_id
            description: USDA field_recall_number — stable identifier across republications.
            tests:
              - not_null
          - name: content_hash
            description: SHA-256 of canonicalized record payload (ADR 0007). Dedup key.
            tests:
              - not_null
          - name: extraction_timestamp
            description: When the extractor wrote this row.
            tests:
              - not_null
          - name: langcode
            description: "'English' or 'Spanish' — bilingual sibling marker (ADR 0006)."
            tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ['English', 'Spanish']
      - name: usda_fsis_recalls_rejected
        description: Quarantine table for USDA records that failed validation or invariant checks (ADR 0013).
        loaded_at_field: rejected_at

  - name: nhtsa
    description: Bronze layer for NHTSA flat-file recalls, loaded by src.extractors.nhtsa.NhtsaExtractor (incremental POST_2010) and NhtsaDeepRescanLoader (full PRE_2010 + POST_2010 corpus).
    schema: public
    tables:
      - name: nhtsa_recalls_bronze
        description: >
          One row per (11-tuple identity, content_hash) landed from
          static.nhtsa.gov/odi/ffdd/rcl/FLAT_RCL_POST_2010.zip (and PRE_2010 on
          deep-rescan). Identity is the 11-tuple per ADR 0030
          (campno + maketxt + modeltxt + yeartxt + compname + rcl_cmpt_id +
          mfr_comp_ptno + mfr_comp_desc + mfr_comp_name + endman + bgman).
          source_recall_id holds RCL.txt's RECORD_ID column but is NOT a
          stable identifier — NHTSA regenerates it on every TSV build per
          Finding K. hash_exclude_fields={source_recall_id} per ADR 0030.
        loaded_at_field: extraction_timestamp
        freshness:
          # NHTSA regenerates files daily but content updates are bursty.
          # 48h covers a missed daily run; 7d flags a real cron failure.
          warn_after: {count: 48, period: hour}
          error_after: {count: 7, period: day}
        columns:
          - name: source_recall_id
            description: RCL.txt RECORD_ID (Running Sequence Number). Regen-unstable per Finding K — preserved for audit/lineage only, never join on this.
            tests:
              - not_null
          - name: content_hash
            description: SHA-256 of canonicalized record payload (ADR 0007), excluding source_recall_id (ADR 0030).
            tests:
              - not_null
          - name: extraction_timestamp
            description: When the extractor wrote this row.
            tests:
              - not_null
          - name: campno
            description: NHTSA recall campaign ID (e.g., 24V930000). Stable upstream identifier.
            tests:
              - not_null
      - name: nhtsa_recalls_rejected
        description: Quarantine table for records that failed validation or invariant checks (ADR 0013); also holds drift rows where the TSV's field count != 29 (Finding F).
        loaded_at_field: rejected_at

  - name: usda_establishments
    description: Bronze layer for USDA FSIS Establishment Listing API, loaded by src.extractors.usda_establishment.UsdaEstablishmentExtractor.
    schema: public
    tables:
      - name: usda_fsis_establishments_bronze
        description: >
          One row per (source_recall_id, content_hash) landed from the USDA FSIS
          Establishment Listing API. source_recall_id reuses the bronze identity
          column convention but holds the FSIS establishment record id, not a
          recall id. Per-establishment demographic + geolocation snapshot;
          weekly Mon/Tue source cadence (full dump every run, no incremental
          filter — see documentation/usda/establishment_api_observations.md).
        loaded_at_field: extraction_timestamp
        freshness:
          # Establishment API publishes weekly Mon/Tue; 14d covers a missed week
          # plus weekend, 30d flags a real outage. Mirrors usda recalls SLA.
          warn_after: {count: 14, period: day}
          error_after: {count: 30, period: day}
        columns:
          - name: source_recall_id
            description: FSIS establishment record id (column name follows the bronze identity convention).
            tests:
              - not_null
          - name: content_hash
            description: SHA-256 of canonicalized record payload (ADR 0007). Dedup key.
            tests:
              - not_null
          - name: extraction_timestamp
            description: When the extractor wrote this row.
            tests:
              - not_null
      - name: usda_fsis_establishments_rejected
        description: Quarantine table for FSIS establishment records that failed validation or invariant checks (ADR 0013).
        loaded_at_field: rejected_at

  - name: uscg
    description: Bronze layer for USCG (United States Coast Guard) boating recalls scraped by src.extractors.uscg.UscgScrapingExtractor. First HTML-scraped source in the project (Phase 5d).
    schema: public
    tables:
      - name: uscg_recalls_bronze
        description: >
          One row per (source_recall_id, content_hash) landed by scraping
          uscgboating.org/content/recalls.php (listing) + recalls-details.php
          (per-recall details). source_recall_id = USCG "Number" field
          (year-prefix encoded per Finding A). hash_exclude_fields={details_url}
          per ADR 0007 — defense against future URL-scheme rewrites.
        loaded_at_field: extraction_timestamp
        freshness:
          # Initial weekly cadence (~36 min full walk); tightened to daily
          # warn_after: 2d / error_after: 5d once Phase 5d Step 6 short-circuit
          # lands. Current SLA covers a missed weekly run + safety margin.
          warn_after: {count: 8, period: day}
          error_after: {count: 14, period: day}
        columns:
          - name: source_recall_id
            description: USCG "Number" field (e.g. 26MF0158). Stable across re-extractions per Step 1 Finding C.
            tests:
              - not_null
          - name: content_hash
            description: SHA-256 of canonicalized record payload (ADR 0007), excluding details_url. Dedup key.
            tests:
              - not_null
          - name: extraction_timestamp
            description: When the extractor wrote this row.
            tests:
              - not_null
      - name: uscg_recalls_rejected
        description: Quarantine table for USCG records that failed validation or invariant checks (ADR 0013).
        loaded_at_field: rejected_at

  - name: uscg_manufacturers
    description: Bronze layer for the USCG boat-manufacturer directory (Manufacturer Identification Code registry) scraped by src.extractors.uscg_manufacturer.UscgManufacturerExtractor. Phase 5d Step 7 — sibling non-recall source paralleling the USDA establishments pattern (recalls + directory).
    schema: public
    tables:
      - name: uscg_manufacturers_bronze
        description: >
          One row per (source_recall_id, content_hash) landed by scraping
          uscgboating.org/content/manufacturers-identification.php (listing).
          source_recall_id = MIC (regulatory 3-char alphanumeric per
          USCG-2013-0133-0005). hash_exclude_fields={detail_url,
          uscg_directory_id} per ADR 0007 — detail_url defends against
          URL-scheme rewrites; uscg_directory_id is page-offset-deterministic
          (Step 1 Finding B) and would churn the content_hash on every
          re-crawl when rows are added/removed earlier in the alphabetical
          ordering. Detail-page fetches are performed by the companion source
          `uscg_manufacturer_details` (Phase 5d Step 7 detail), which captures
          full addresses + succession lineage; THIS listing table stays the
          5-field, ~30-char-truncated source (Step 1 Finding C / F.1).
        loaded_at_field: extraction_timestamp
        freshness:
          # Directory updates infrequently (the public CSV's Last-Modified
          # was 2019-10-18; HTML view is more current). Weekly cadence on
          # the extractor side; SLA covers a missed weekly run + safety margin.
          warn_after: {count: 14, period: day}
          error_after: {count: 30, period: day}
        columns:
          - name: source_recall_id
            description: USCG Manufacturer Identification Code (MIC) — regulatory 3-character alphanumeric.
            tests:
              - not_null
          - name: content_hash
            description: SHA-256 of canonicalized record payload (ADR 0007), excluding detail_url and uscg_directory_id. Dedup key.
            tests:
              - not_null
          - name: extraction_timestamp
            description: When the extractor wrote this row.
            tests:
              - not_null
      - name: uscg_manufacturers_rejected
        description: Quarantine table for USCG manufacturer records that failed validation or invariant checks (ADR 0013).
        loaded_at_field: rejected_at

  - name: uscg_manufacturer_details
    description: Bronze layer for the USCG manufacturer DETAIL pages (Path B) scraped by src.extractors.uscg_manufacturer_detail.UscgManufacturerDetailExtractor. Phase 5d Step 7 (detail) — per-MIC detail-page enrichment sibling to uscg_manufacturers; captures the succession lineage (Past Company / OOB), full untruncated address, contact fields, status, and Date Modified that the listing source lacks.
    schema: public
    tables:
      - name: uscg_manufacturer_details_bronze
        description: >
          One row per (source_recall_id, content_hash) landed by fetching each MIC's
          detail page at uscgboating.org/content/manufacturers-identification-detail.php?id=N
          (confirmed direct-GET, §M.2). source_recall_id = MIC. Work-list sourced from
          uscg_manufacturers_bronze (listing-delta cursor for incremental; full sweep for
          deep-rescan). hash_exclude_fields={detail_url, uscg_directory_id} per ADR 0007;
          date_modified IS included in the hash (the Path B change signal).
        loaded_at_field: extraction_timestamp
        freshness:
          # Detail enrichment runs behind the listing source; SLA covers a missed
          # weekly run + margin (mirrors uscg_manufacturers).
          warn_after: {count: 14, period: day}
          error_after: {count: 30, period: day}
        columns:
          - name: source_recall_id
            description: USCG Manufacturer Identification Code (MIC) — regulatory 3-character alphanumeric.
            tests:
              - not_null
          - name: content_hash
            description: SHA-256 of canonicalized record payload (ADR 0007), excluding detail_url and uscg_directory_id; includes date_modified. Dedup key.
            tests:
              - not_null
          - name: extraction_timestamp
            description: When the extractor wrote this row.
            tests:
              - not_null
      - name: uscg_manufacturer_details_rejected
        description: Quarantine table for USCG manufacturer-detail records that failed validation or invariant checks (ADR 0013).
        loaded_at_field: rejected_at

  - name: pipeline
    description: >
      Cross-source pipeline-state tables (alembic-managed, not bronze; src/extractors/_tables.py).
      Consumed by silver history models — recall_event_history joins extraction_runs on
      raw_landing_path to read each snapshot's change_type for the ADR 0027 re-baseline
      exclusion. schema=public (migration 0001 + later).
    schema: public
    tables:
      - name: extraction_runs
        description: >
          One row per extraction run. change_type (ADR 0027) distinguishes routine loads from
          schema_rebaseline / hash_helper_rebaseline / historical_seed / etag_audit; raw_landing_path
          is the 1:1 link bronze rows carry back to their loading run.
        columns:
          - name: run_id
            description: uuid4 per run (unique constraint added in migration 0027).
          - name: raw_landing_path
            description: R2 key of the run's landed payload; the join key from bronze rows.
          - name: change_type
            description: routine / schema_rebaseline / hash_helper_rebaseline / historical_seed / etag_audit.
      - name: extraction_run_identities
        description: >
          Per-run presence manifest (ADR 0026, migration 0027): one row per (run_id, source,
          source_recall_id, langcode) returned by a successful run. Written by USDA (daily) +
          NHTSA (deep-rescan only; keyed on campno) — DedupContract.default_track_presence +
          Extractor.writes_presence_manifest. Consumed by recall_lifecycle for
          is_currently_active / was_ever_retracted; join run_id → extraction_runs for run timing.
        columns:
          - name: run_id
            description: FK → extraction_runs.run_id.
          - name: source
            description: Source name (usda today).
          - name: source_recall_id
            description: Recall identity (stored verbatim; trim() on read to match silver's canonical form, Finding R).
          - name: langcode
            description: USDA bilingual marker (English/Spanish); NULL for single-key sources.

  - name: enrichment
    description: >
      Derived (non-bronze) tables written by Python enrichment steps, not by an
      extractor. Phase 6b firm entity resolution. schema=public matches the
      alembic-created table (migration 0024); the silver firm / recall_event_firm
      models LEFT JOIN firm_crosswalk for the additive canonical_firm_id (PR 6b.4).
    schema: public
    tables:
      - name: firm_crosswalk
        description: >
          Cross-source firm-resolution crosswalk: one row per firm_id
          (= md5(normalized_name) from silver firm.sql) mapping it to its cluster
          representative canonical_firm_id. Written by the `recalls resolve-firms`
          CLI (PR 6b.4, USER-run): deterministic FEI/succession forced-merges +
          RapidFuzz edit-distance clustering. Created empty by migration 0024;
          0 rows until 6b.4 runs the resolver. No freshness block — it is rebuilt
          on demand, not on a cron cadence.
        columns:
          - name: firm_id
            description: md5(normalized_name) — the per-name firm key from firm.sql. Natural PK.
            tests:
              - not_null
              - unique
          - name: canonical_firm_id
            description: The cluster representative's firm_id; equals firm_id for singletons.
            tests:
              - not_null
          - name: match_confidence
            description: Resolution path (e.g. 'fei_exact', 'rapidfuzz_high', 'singleton').
            tests:
              - not_null
          - name: resolver_version
            description: Blocking-key + threshold config the CLI used, for auditable rebuilds.
            tests:
              - not_null

      - name: quantity_crosswalk
        description: >
          Free-text recall-quantity crosswalk (C13): one row per distinct raw quantity string
          (FDA product_distributed_quantity + USDA qty_recovered) mapping it to parsed
          quantity_value / quantity_unit / quantity_category / quantity_basis. Written by
          `recalls parse-quantities` (USER-run); created empty by migration 0032, 0 rows until the
          CLI runs. recall_product LEFT JOINs it on number_of_units. Rebuilt on demand, no cadence.
        columns:
          - name: raw_quantity
            description: The raw quantity string — natural PK, = recall_product.number_of_units.
            tests:
              - not_null
              - unique
          - name: quantity_category
            description: count | weight | volume | grouping (NULL when no unit recognized).
            tests:
              - accepted_values:
                  arguments:
                    values: ['count', 'weight', 'volume', 'grouping']
          - name: quantity_basis
            description: per_product | total_all_products | unknown.
            tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ['per_product', 'total_all_products', 'unknown']
