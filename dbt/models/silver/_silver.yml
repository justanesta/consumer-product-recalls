version: 2

models:
  - name: recall_event
    description: Header-level recall events, one row per (source, source_recall_id) (ADR 0002).
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - source
              - source_recall_id
    columns:
      - name: recall_event_id
        description: Surrogate key md5(source || '|' || source_recall_id).
        tests:
          - not_null
          - unique
      - name: source
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['CPSC', 'FDA', 'USDA', 'NHTSA', 'USCG']
      - name: source_recall_id
        tests:
          - not_null
      - name: announced_at
        description: >
          True recall-initiation date — NULLABLE by design (~20 FDA events). Two null classes:
          ~6 early-2000s archive recalls with no source-provided initiation date, and ~14 with a
          dropped-century typo in recall_initiation_dt (nulled in recall_event.sql via a >=1940
          guard rather than trusting a garbage year — see that model's comment). We do not fabricate
          dates; published_at is the guaranteed date downstream sorts on. The not_null below is
          severity=warn: a watch-list. If it grows materially beyond ~20, investigate.
        tests:
          - not_null:
              config:
                severity: warn
      - name: published_at
        description: >
          Last-published/modified date, coalesced to be present for every row —
          the hard NOT-NULL contract date downstream (gold/API) sorts and filters
          on. Contrast announced_at, which is nullable by design.
        tests:
          - not_null
      - name: distribution_scope
        description: >
          Cross-source distribution-scope enum (ADR 0036 D7; finished in the Phase 6e geography
          foundation via the classify_distribution_scope macro). Derived from FDA
          distribution_area_summary + USDA states; NHTSA defaults to Nationwide (federal vehicle
          recalls are national by regulation); CPSC + USCG carry no distribution field, so
          Unspecified. Closed, NOT-NULL domain.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Nationwide', 'International', 'Regional', 'Unspecified']
    # (source, source_recall_id) uniqueness is now enforced explicitly via the
    # model-level dbt_utils.unique_combination_of_columns test above; the
    # recall_event_id unique test covers the same grain transitively (md5 key).

  - name: recall_product
    description: Line-level recall products, one row per affected product instance (ADR 0002).
    columns:
      - name: recall_product_id
        tests:
          - not_null
          - unique
      - name: recall_event_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('recall_event')
                field: recall_event_id
      - name: source
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['CPSC', 'FDA', 'USDA', 'NHTSA', 'USCG']
      # C13: structured quantity parsed from number_of_units via quantity_crosswalk (FDA + USDA;
      # NULL for other sources / unparseable). v1 is PRECISION-scoped (2026-06-09): a value is emitted
      # only for clean single-quantity strings (~70% value+unit, +17% value-only); the messy ~10%
      # (lot/list/code/multi-product) is deliberately NULL, deferred to an AI extractor (v2,
      # freetext-enrichment-backlog). Raw number_of_units is preserved alongside.
      - name: quantity_value
        description: >
          Parsed numeric quantity for clean single-quantity strings; NULL for sentinels, un-numbered
          text, and the deliberately-unparsed messy tail (lot/list/code/multi-product → v2).
      - name: quantity_unit
        description: Canonical unit (each / case / bottle / pound / …); NULL when no unit recognized.
      - name: quantity_category
        description: count | weight | volume | grouping (NULL when no unit).
        tests:
          - accepted_values:
              arguments:
                values: ['count', 'weight', 'volume', 'grouping']
      - name: quantity_basis
        description: per_product | total_all_products | unknown (NULL for non-FDA/USDA rows).
        tests:
          - accepted_values:
              arguments:
                values: ['per_product', 'total_all_products', 'unknown']

  - name: recall_product_history
    description: >
      Full product-grain version history for NHTSA recall products (Phase 6c.6 Layer 2, ADR 0033) —
      every snapshot version with dbt_valid_from/to + an is_current flag (Policy C peer of the
      current view). Kept through the 6c.7 cutover. Forward-only reach (starts at first snapshot
      run); bronze is the deeper audit trail.
    columns:
      - name: recall_product_id
        description: v1.5 7-tuple md5 — repeats across versions (NOT unique here).
        tests:
          - not_null
      - name: dbt_scd_id
        description: dbt-generated surrogate, one per version.
        tests:
          - not_null
          - unique
      - name: is_current
        tests:
          - not_null

  - name: firm
    description: >
      Conformed firm dimension, deduped by normalized name across all 5 sources
      (ADR 0002). Role-specific structured attributes live in the
      firm_usda_attributes (USDA) and firm_uscg_attributes
      (USCG) sidecars, joined via observed_company_ids. Cross-source fuzzy
      name resolution is deferred to Phase 6b.
    columns:
      - name: firm_id
        tests:
          - not_null
          - unique
      - name: normalized_name
        description: >
          Representative cleaned name for the canonical firm. As of Phase 6b PR 6b.1
          the firm grain is canonical_firm_id (clean → cluster), so normalized_name is
          a display representative of that grain, NOT the key — its `unique` test was
          dropped (critic C5; two raw spellings can clean to one canonical, and the
          representative is derived across the Python/SQL upper() boundary). firm_id
          (= canonical_firm_id) carries uniqueness.
        tests:
          - not_null
      - name: canonical_name
        tests:
          - not_null
      - name: alternate_names
        description: >
          JSONB array of surface-form aliases — the DBA brand plus any brand-bearing
          parentheticals ("Deere & Company (John Deere)" -> "John Deere"), preserved for
          search + RapidFuzz match recall (Phase 6b). Flattened + de-duped across the
          canonical firm from firm_crosswalk.alternate_names. Nullable, untested.

  - name: firm_usda_attributes
    description: >
      FSIS-regulated establishment dim with demographic + geolocation +
      regulatory metadata. Phase 5b.2 Step 5; one row per establishment_id
      (= FSIS establishment_number, also written to firm.observed_company_ids
      for USDA-establishment firms).
    columns:
      - name: establishment_id
        tests:
          - not_null
          - unique
      - name: establishment_name
        tests:
          - not_null
      - name: address
        tests:
          - not_null
      - name: state
        tests:
          - not_null
      - name: zip
        tests:
          - not_null
      - name: status_regulated_est
        tests:
          - accepted_values:
              arguments:
                values: ['', 'Inactive']

  - name: firm_uscg_attributes
    description: >
      USCG-registered boat-manufacturer dim — the CURRENT view (dbt_valid_to is null)
      over the SCD-2 snapshot firm_uscg_attributes_snapshot (ADR 0035). One row
      per mic (= USCG Manufacturer Identification Code, also written to
      firm.observed_company_ids for USCG firms via the recalls-side join). Source switched
      from the listing view to the detail-page snapshot, so the address is now the FULL
      untruncated value (fixes the ~30-char Finding F.1 truncation) and the succession
      lineage (past_company_1/2/3, parent_*) is present. mic_has_prior_holder /
      mic_oob_recycled flag the MIC-recycle NEED (mirror assert_mic_holder_stable.sql:
      all three Past Company slots, `\(OOB` marker); recall_event_firm stamps
      uscg_mic_time_sensitive_unresolved from them. SCD-2 history is the snapshot (Policy C).
    columns:
      - name: mic
        tests:
          - not_null
          - unique
      - name: detail_url
        tests:
          - not_null
      - name: mic_has_prior_holder
        description: True when any Past Company slot is populated (the ~365 set).
        tests:
          - not_null
      - name: mic_oob_recycled
        description: >
          True when a Past Company is marked out-of-business in ANY source notation — `(OOB)`,
          `(OOB 1991)`, or the dash form `- OOB` (word-boundary `\yOOB\y`; `(previous name)` renames
          are excluded). A subset of mic_has_prior_holder. NB: assert_mic_holder_stable.sql's
          published "205" counts the paren form only and undercounts the true recycle set.
        tests:
          - not_null
      - name: prior_holders
        description: jsonb array of the non-null Past Company names, for inspection.

  - name: firm_fda_attributes
    description: >
      FDA-registered establishment dim with address + firm-continuity metadata.
      Capture-expansion (b) PR W1; one row per firm_fei_num (= FDA FEI, also
      written to firm.observed_company_ids for FDA firms). No directory source —
      reconstructed DISTINCT ON (firm_fei_num) latest from the recall feed
      (stg_fda_recalls). Firms with a null FEI (0.4%, 2026-06-03 profile) have no
      row here; their names still live in firm.sql. firm_fei_num is the hard key
      (not_null + unique). firm_legal_nam / firm_city_nam / firm_country_nam /
      firm_line1_adr are ~100% on full corpus but tested severity=warn (Q4
      populations are rounded; a handful of nulls at FEI grain should be a
      watch-list, not a build break). state / postal / surviving are legitimately
      nullable (86.8% / 96.0% / 7.0%).
    columns:
      - name: firm_fei_num
        tests:
          - not_null
          - unique
      - name: firm_legal_nam
        tests:
          - not_null:
              config:
                severity: warn
      - name: firm_city_nam
        tests:
          - not_null:
              config:
                severity: warn
      - name: firm_country_nam
        tests:
          - not_null:
              config:
                severity: warn
      - name: firm_line1_adr
        tests:
          - not_null:
              config:
                severity: warn

  - name: recall_event_firm
    description: >
      Many-to-many between recall events and firms with role. Roles: CPSC
      manufacturer/importer/distributor (retailer removed per Option B →
      recall_event.sales_channel_narrative); FDA/USDA establishment; NHTSA
      filer (mfgname) + manufacturer (mfgtxt) split; USCG manufacturer. Kept
      in lockstep with firm.sql.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - recall_event_id
              - firm_id
              - role
    columns:
      - name: recall_event_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('recall_event')
                field: recall_event_id
      - name: firm_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('firm')
                field: firm_id
      - name: role
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['manufacturer', 'importer', 'distributor', 'establishment', 'filer']
      - name: match_confidence
        description: >
          Firm-resolution path/quality for this bridge row (Phase 6b). Defaults to
          'exact_name'; per-source PRs overwrite it (6b.1 CPSC, 6b.2 USDA, 6b.4
          RapidFuzz, 6b.5 USCG MIC time-sensitivity). The full namespaced
          vocabulary is single-homed below; 6b.6 promoted it to **error** now that
          every source's value set has landed (6b.0–6b.5) — an unexpected label is a bug.
        tests:
          - accepted_values:
              config:
                severity: error
              arguments:
                values:
                  - exact_name
                  # Source-agnostic deterministic-cleaning tiers (6b.4: the crosswalk PK is
                  # global, so confidence labels the rule, not the source). Renamed from the
                  # 6b.1 cpsc_* names when the other sources joined the crosswalk. Paren
                  # strip was scoped out (ADR 0037) — paren-variants resolve via RapidFuzz.
                  - geo_suffix_strip_exact
                  - dba_extract_exact
                  - usda_unambiguous
                  - usda_product_items_extract
                  - usda_state_match
                  - usda_processing_match
                  - usda_multi_signal
                  - usda_ambiguous_null
                  - uscg_mic_unambiguous
                  - uscg_mic_time_sensitive_unresolved
                  - uscg_mic_build_date_resolved
                  # Tiered name/FEI resolution (6b.4, ADR 0037). Tier 0 = fei_exact (FDA
                  # current-FEI group). Tier 1 = name_variant_exact (identical distinctive set)
                  # / name_typo_high (token_sort_ratio typo). Tier 2 = rapidfuzz_rollup (>=2
                  # shared distinctive tokens; the reviewable tier). singleton = unmerged.
                  - fei_exact
                  - name_variant_exact
                  - name_typo_high
                  - rapidfuzz_rollup
                  - singleton
      - name: establishment_number
        description: >
          FSIS establishment number resolved for USDA establishment bridge rows (Phase 6b 6b.2,
          from recall_event_establishment_resolution joined on recall_event_id). NULL for non-USDA
          rows and for USDA fan-outs that stayed usda_ambiguous_null. Nullable, untested.
    # Composite uniqueness of (recall_event_id, firm_id, role) is now enforced
    # explicitly via the model-level dbt_utils.unique_combination_of_columns
    # test above (the SELECT DISTINCT in the model also guarantees it).

  - name: recall_event_press_release
    description: >
      FDA press releases (Tier-3, capture-expansion (b) PR) — event-grain child of
      recall_event, M:1 (an event can carry several). FDA-only; lookup-endpoint-only data
      (Finding K0). One row per (event, press-release URL). Joined to recall_event via
      recall_event_id.
    columns:
      - name: recall_event_press_release_id
        tests:
          - not_null
          - unique
      - name: recall_event_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('recall_event')
                field: recall_event_id
      - name: url
        tests:
          - not_null

  - name: recall_event_establishment_resolution
    description: >
      USDA recall -> FSIS establishment disambiguation (Phase 6b PR 6b.2). One row per USDA
      recall_event_id with >=1 name-matched establishment, resolving the free-text establishment
      name to a single establishment_number via a precision-first signal hierarchy
      (unambiguous > embedded establishment number > field_states match > ambiguous_null).
      recall_event_firm joins this on recall_event_id to stamp establishment_number +
      match_confidence on USDA bridge rows. ~688/786 name-matched recalls resolve; the ~12.5%
      ambiguous_null are mostly multi-plant producers with no stated number (correctly NULL).
    columns:
      - name: recall_event_id
        tests:
          - not_null
          - unique
      - name: establishment_number
        description: >
          Resolved FSIS establishment_number (the '+'-composite id), or NULL when the fan-out is
          unresolved (precision-over-recall — a wrong attribution is worse than none).
      - name: match_confidence
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - usda_unambiguous
                  - usda_product_items_extract
                  - usda_state_match
                  - usda_ambiguous_null

  - name: firm_fei_edges
    description: >
      FDA shared-FEI + surviving-FEI succession edges (Phase 6b PR 6b.3) — the
      deterministic forced-merge constraints the 6b.4 RapidFuzz clusterer consumes
      (union-find) so the 12.4% of FEIs mapping to >1 legal name collapse without fuzzy.
      One row per distinct (firm_id, normalized_name, firm_fei_num, firm_surviving_fei)
      from stg_fda_recalls where firm_fei_num is not null. NOT yet consumed by firm.sql /
      recall_event_firm.sql (6b.4 wires it) — additive, no lockstep impact. firm_id is the
      pre-clustering raw md5(upper(trim(firm_legal_nam))); intentionally NOT relationship-
      tested against firm.firm_id (it feeds the pass that makes firm.firm_id canonical).
    columns:
      - name: firm_id
        description: md5(upper(trim(firm_legal_nam))) — mirrors firm.sql's fda_normalized firm_id.
        tests:
          - not_null
      - name: firm_fei_num
        description: FDA FEI (government establishment id). Shared firm_fei_num across rows = a forced merge.
        tests:
          - not_null
      - name: firm_surviving_fei
        description: >
          FDA's own successor-FEI pointer for renamed/merged firms (NULL for most). A live
          (firm_fei_num -> firm_surviving_fei) pair is a directed succession edge; 6b.4's
          clusterer interprets it (ignores null/self/dangling, guards cycles). Nullable, untested.

  - name: recall_event_history
    description: >
      Field-level edit history of the recall EVENT (ADR 0022 / Phase 6c.1). One row per changed
      tracked field per snapshot interval, synthesized via LAG() over content-hash-deduped bronze
      across all five sources. Re-baseline runs are excluded (ADR 0027) and cosmetic (whitespace,
      ''/NULL) changes are folded out (norm_text_for_change macro). Curated v1 field set:
      recall_reason, classification, lifecycle_status, title, terminated_at. SPARSE post-6a.5-reseed
      (~1 version per identity); grows as incrementals re-bank versions. See silver_design_notes.md.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - source
              - source_recall_id
              - langcode
              - field_name
              - changed_at
    columns:
      - name: source
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['CPSC', 'FDA', 'USDA', 'NHTSA', 'USCG']
      - name: source_recall_id
        description: Event identity — RecallNumber (CPSC), RECALLEVENTID (FDA), field_recall_number (USDA), campno (NHTSA, NOT the regen-unstable RECORD_ID), USCG Number.
        tests:
          - not_null
      - name: field_name
        description: Canonical event field whose value changed.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['recall_reason', 'classification', 'lifecycle_status', 'title', 'terminated_at']
      - name: changed_at
        description: Snapshot extraction_timestamp at which the new value was first observed.
        tests:
          - not_null
      - name: change_type
        description: The changing snapshot's run change_type; always a non-rebaseline value (ADR 0027 exclusion). old_value/new_value are RAW (un-normalized).
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['routine', 'historical_seed', 'etag_audit']

  - name: recall_lifecycle
    description: >
      Per-recall lifecycle summary (ADR 0026 / Phase 6c.2), one row per recall_event.
      first_seen_at / last_seen_at / edit_count are bronze-derived (all 5 sources, manifest-
      independent — but bounded by the 6a.5 reseed; use announced_at for recall age).
      is_currently_active / was_ever_retracted come from the presence manifest (USDA + NHTSA; C16).
      NHTSA presence keys on campno and is written only by the full-corpus deep-rescan, so it is NULL
      until the first deep-rescan banks a manifest (WS-H). NULL for CPSC/FDA/USCG. See silver_design_notes.md.
    columns:
      - name: recall_event_id
        description: FK to recall_event (1:1).
        tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('recall_event')
                field: recall_event_id
      - name: source
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['CPSC', 'FDA', 'USDA', 'NHTSA', 'USCG']
      - name: source_recall_id
        tests:
          - not_null
      - name: first_seen_at
        description: First bronze observation since the 6a.5 reseed (pipeline-observation, NOT recall age).
        tests:
          - not_null
      - name: last_seen_at
        description: Last bronze version's timestamp (last change). Presence "now" is is_currently_active.
        tests:
          - not_null
      - name: edit_count
        description: Distinct content versions observed (1 = never changed since first seen).
        tests:
          - not_null
      - name: is_currently_active
        description: USDA-only (v1) — identity present in the latest enumerating run's manifest. NULL for other sources.
      - name: was_ever_retracted
        description: USDA-only (v1) — absent from some enumerating run since first appearance. NULL for other sources.

  - name: uscg_mic_reassignment_years
    description: >
      USCG MIC reassignment boundary per MIC (ADR 0035 §5 historical backfill; Phase 6c.5 (b)).
      current_holder_since_year = latest parsed "(OOB YYYY)" year from the detail-page Past Company
      lineage = roughly when the current holder took over a recycled MIC. recall_event_firm's
      as-of-build-year join (6c.5 c) compares a recall's model_year to it. Thin by nature: only the
      ~23 of 221 OOB-recycled MICs that carry a parseable year appear (gate Q2); the rest are undated.
    columns:
      - name: mic
        description: MIC anchor (upper(trim), from firm_uscg_attributes).
        tests:
          - not_null
          - unique
      - name: current_holder_since_year
        description: Latest parsed reassignment year (NOT NULL — undated MICs are excluded).
        tests:
          - not_null

  - name: recall_distribution_area
    description: >
      Tier-2 structured distribution geography (Phase 6e foundation; distribution_country_codes
      added 2026-06-09, C12). One row per recall_event (FDA + USDA) with >=1 parseable US state OR
      foreign country. distribution_state_codes (text[] of USPS 2-letter codes) is parsed
      precision-over-recall from the domestic segment (international markers cut first);
      distribution_country_codes (text[] of ISO-3166-1 alpha-2) from the international tail via the
      country_iso seed (names-only, US-state-collision names excluded). Either array may be empty
      (a country-only recall has empty state_codes[]; a domestic recall empty country_codes[]).
      recall_events with no parseable geography have no row here (carried by
      recall_event.distribution_scope). Feeds fct_recalls_by_geography + mart_recall_summary.
    columns:
      - name: recall_event_id
        tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('recall_event')
                field: recall_event_id
      - name: n_distribution_states
        tests:
          - not_null
      - name: n_distribution_countries
        tests:
          - not_null
