version: 2

snapshots:
  - name: firm_uscg_attributes_snapshot
    description: >
      SCD-2 history of the USCG manufacturer directory, keyed on the stable `mic`
      anchor (ADR 0035; first cross-source SCD-2 instance). strategy='check' over the
      firm-attribution fields; dbt manages dbt_valid_from / dbt_valid_to / dbt_scd_id.
      The current view (dbt_valid_to is null) feeds firm_uscg_attributes; the
      full table is the queryable peer history (Policy C). Lands in the silver_snapshots
      schema (exempt from ADR 0007 bronze-snapshot pruning). Heartbeat fields
      (in_business, date_modified) are deliberately NOT check_cols — see the model
      header. Re-run on an unchanged corpus must bank 0 new versions (idempotency).
    columns:
      - name: mic
        description: USCG Manufacturer Identification Code, upper(trim)-normalized — the SCD anchor.
        tests:
          - not_null
      - name: dbt_scd_id
        description: dbt-generated surrogate, one per version.
        tests:
          - unique
          - not_null
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - mic
              - dbt_valid_from

  - name: firm_usda_attributes_snapshot
    description: >
      SCD-2 history of USDA FSIS establishment attributes, keyed on the stable
      establishment_number anchor (ADR 0035 Policy C; Phase 6c.4 BENEFIT dim). strategy='check'
      over the demographic/regulatory fields (latest_mpi_active_date EXCLUDED — heartbeat,
      ADR 0032). Current view (dbt_valid_to is null) feeds firm_usda_attributes; full
      table is the queryable peer history (the status_regulated_est flip case). silver_snapshots
      schema (ADR 0007 pruning-exempt). Forward-banking: 0 edit-versions today; re-run on an
      unchanged corpus must bank 0 new versions.
    columns:
      - name: establishment_number
        description: FSIS establishment id — the SCD anchor.
        tests:
          - not_null
      - name: dbt_scd_id
        tests:
          - unique
          - not_null
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - establishment_number
              - dbt_valid_from

  - name: firm_fda_attributes_snapshot
    description: >
      SCD-2 history of FDA firm attributes, keyed on the stable firm_fei_num anchor (ADR 0035
      Policy C; Phase 6c.4 BENEFIT dim). strategy='check' over the firm name + address +
      succession fields; driver collapses the product-level recall feed to one row per FEI
      (DISTINCT ON ... event_lmd). Current view feeds firm_fda_attributes. silver_snapshots
      schema (ADR 0007 pruning-exempt). Forward-banking: 0 edit-versions today.
    columns:
      - name: firm_fei_num
        description: FDA FEI — the SCD anchor.
        tests:
          - not_null
      - name: dbt_scd_id
        tests:
          - unique
          - not_null
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - firm_fei_num
              - dbt_valid_from

  - name: nhtsa_recall_product_snapshot
    description: >
      SCD-2 product-grain history for NHTSA recall products, keyed on the stable 7-tuple
      recall_product_id anchor (ADR 0033 + 2026-06-06 amendment / 0034; Phase 6c.6 Layer 2).
      strategy='check' over the genuinely drift-prone fields (mfr_comp_desc, mfr_comp_name, bgman,
      endman — Pierce + batch-window classes — WIDENED per the ADR 0034 refinement to also cover
      rcltype, potaff, mfgname, mfgtxt, fmvss so the current view never goes stale on an isolated
      non-check edit). mfr_comp_ptno is in the ANCHOR, NOT check_cols: the full-corpus finding showed
      the 6-tuple's demotion of ptno collapsed 126k STRUCTURAL multi-part rows (legitimate facts).
      The 7 anchor fields, model_year, and the extraction_timestamp heartbeat are deliberately NOT
      check_cols — see the snapshot header. Current view (dbt_valid_to is null) feeds
      recall_product's NHTSA branch (since the 6c.7 cutover); the full table is the queryable
      peer history (recall_product_history, Policy C). silver_snapshots schema (ADR 0007
      pruning-exempt). Re-run on an unchanged corpus must bank 0 new versions (idempotency — the
      Layer 2 gate).
    columns:
      - name: recall_product_id
        description: v1.5 7-tuple md5 — the SCD anchor (single-homed in stg_nhtsa_recalls_current).
        tests:
          - not_null
      - name: dbt_scd_id
        tests:
          - unique
          - not_null
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - recall_product_id
              - dbt_valid_from
