name: consumer_product_recalls
version: '1.0.0'
config-version: 2

profile: consumer_product_recalls

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  consumer_product_recalls:
    staging:
      +materialized: view
    silver:
      +materialized: table
      # Oscillation-safe index builder (gold-audit 2026-W26): reads each model's config(meta.index_specs)
      # and DROP-THEN-CREATEs them on the FINAL relation post-swap. Replaces config(indexes=[...]), which
      # dbt 1.11.x oscillates out every other build (see macros/rebuild_indexes.sql / ADR 0038 §2026-W26).
      # Index-less models render to nothing (dbt skips the empty hook), so it is safe folder-wide.
      +post-hook: "{{ rebuild_indexes() }}"
    gold:
      +materialized: view
      # 1) rebuild_indexes() — same oscillation-safe index builder as silver (reads config(meta.index_specs)).
      # 2) grant_gold_readonly() — re-grant SELECT to the public read-only API role (recalls_readonly)
      #    after every gold build so it survives the nightly drop+recreate. Gold-only by folder scope;
      #    tolerant of the role being absent (dev/CI). Role provisioned by migration 0034 (serving R1).
      +post-hook:
        - "{{ rebuild_indexes() }}"
        - "{{ grant_gold_readonly() }}"

# Singular tests under tests/source_assumptions/ check load-bearing source-API
# assumptions (CPSC products[] append-only, FDA PRODUCTID stable, USDA bilingual
# atomicity, NHTSA 11-tuple drift). Per ADR 0031, some assumptions have known
# non-zero baselines (e.g., NHTSA AC DELCO maketxt drift at ~1 case/day) — these
# tests surface violations as warnings rather than build failures, so the
# threshold-based posture in ADR 0031's per-source table holds. Severity
# escalation (warn → error) is deferred until the Soda Core / Great Expectations
# migration in Phase 7 (implementation_plan.md:643), at which point threshold-
# aware assertions become natural.
#
tests:
  consumer_product_recalls:
    source_assumptions:
      +severity: warn
