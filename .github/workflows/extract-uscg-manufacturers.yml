name: Extract USCG Manufacturers

# USCG manufacturer-directory listing extract (short-circuit). Slow-changing
# reference data — weekly is ample. The page-0 Records-Found + content-hash
# precheck makes a no-change run cheap. --lookback-days has no effect (page-0
# Records-Found precheck + full directory scrape on change); accepted for
# parity. Bronze content-hash dedup handles idempotency. Runs Mon 01:00, ahead
# of the Tier-1 detail extract (Mon 01:15) that derives its work-list from this
# listing's bronze delta.

on:
  # Guarded by vars.CRON_ENABLED (off until go-live, phase-7 C40).
  schedule:
    - cron: "0 1 * * 1" # weekly Mon 01:00 UTC (ADR 0010 grid)
  workflow_dispatch:
    inputs:
      lookback_days:
        description: "Ignored for uscg_manufacturers; accepted for parity"
        required: false
        default: ""

jobs:
  extract:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'schedule' || vars.CRON_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv python install
      - run: uv sync --frozen

      - name: Validate required secrets
        run: |
          [[ -n "$NEON_DATABASE_URL" ]] || (echo "::error::NEON_DATABASE_URL secret is missing" && exit 1)
          [[ -n "$R2_BUCKET_NAME" ]] || (echo "::error::R2_BUCKET_NAME secret is missing" && exit 1)
          [[ -n "$R2_ACCOUNT_ID" ]] || (echo "::error::R2_ACCOUNT_ID secret is missing" && exit 1)
          [[ -n "$R2_ACCESS_KEY_ID" ]] || (echo "::error::R2_ACCESS_KEY_ID secret is missing" && exit 1)
          [[ -n "$R2_SECRET_ACCESS_KEY" ]] || (echo "::error::R2_SECRET_ACCESS_KEY secret is missing" && exit 1)
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

      - name: Run USCG manufacturers extractor
        run: |
          if [[ -n "${{ github.event.inputs.lookback_days }}" ]]; then
            uv run recalls extract uscg_manufacturers --lookback-days "${{ github.event.inputs.lookback_days }}"
          else
            uv run recalls extract uscg_manufacturers
          fi
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
