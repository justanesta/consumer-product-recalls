name: Secret Rotation Reminder

# Phase 7 secret-rotation reminder (ADR 0016 — all credentials rotated every 90
# days). Quarterly, this upserts a single "Rotate secrets" tracking issue so the
# operator has a standing reminder in the GitHub UI. documentation/operations.md
# ("Secret rotation runbooks") already describes this workflow as if it exists;
# this file closes that doc-vs-reality gap.
#
# Find-by-marker upsert (same pattern as firm-rollup-audit.yml): if an open issue
# carrying the marker comment already exists, leave it alone (the operator hasn't
# closed last quarter's reminder yet); otherwise open a fresh one. No DB / network
# access — issues API only.

on:
  schedule:
    - cron: "0 9 1 1,4,7,10 *" # 09:00 UTC on the 1st of Jan/Apr/Jul/Oct (quarterly)
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write # to open/refresh the rotation-reminder tracking issue

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Open / refresh the secret-rotation reminder issue
        uses: actions/github-script@v9
        with:
          script: |
            const marker = '<!-- secret-rotation-reminder -->';
            const title = 'Rotate secrets (quarterly — 90-day cycle, ADR 0016)';
            const body = [
              marker,
              `Quarterly secret-rotation reminder, opened ${new Date().toISOString().slice(0,10)}.`,
              '',
              'Per ADR 0016 all credentials are rotated every 90 days. Follow the',
              'rotation runbooks in `documentation/operations.md` → "Secret rotation runbooks":',
              'rotate each credential at the provider, update the matching GitHub Actions',
              'repository secret, and verify the local `.env` and GHA copies stay in sync.',
              '',
              'Close this issue once all credentials for this quarter are rotated.',
            ].join('\n');
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100,
            });
            const hit = existing.data.find(i => (i.body || '').includes(marker));
            if (hit) {
              core.info(`Open rotation reminder already exists (#${hit.number}); leaving it as-is.`);
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo, title, body,
                labels: ['security', 'secret-rotation'],
              });
              core.info(`Opened rotation reminder #${created.data.number}.`);
            }
