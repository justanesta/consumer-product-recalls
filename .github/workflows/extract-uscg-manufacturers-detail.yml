name: Extract USCG Manufacturer Details

# USCG manufacturer detail-page enrichment (Phase 5d Step 7, Path B). This is the
# Tier-1 *incremental* detail extract — cron-safe (only the Tier-2 full sweep in
# deep-rescan-uscg-manufacturers-detail.yml is the >6h problem). --lookback-days is
# accepted for parity but ignored: the work-list is a listing-delta cursor over
# bronze (the incremental run fetches detail pages only for MICs whose listing row
# changed since their last detail fetch, or were never fetched). Bronze
# content-hash dedup handles idempotency. Runs Mon 01:15, after the manufacturers
# listing extract at Mon 01:00 — the listing-delta work-list dependency.

on:
  # Guarded by vars.CRON_ENABLED (off until go-live, phase-7 C40).
  schedule:
    - cron: "15 1 * * 1" # weekly Mon 01:15 UTC, after the listing at 01:00 (ADR 0010 grid)
  workflow_dispatch:
    inputs:
      lookback_days:
        description: "Ignored for uscg_manufacturer_details; accepted for parity"
        required: false
        default: ""

jobs:
  extract:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'schedule' || vars.CRON_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
      - run: uv python install
      - run: uv sync --frozen

      - name: Validate required secrets
        run: |
          [[ -n "$NEON_DATABASE_URL" ]] || (echo "::error::NEON_DATABASE_URL secret is missing" && exit 1)
          [[ -n "$R2_BUCKET_NAME" ]] || (echo "::error::R2_BUCKET_NAME secret is missing" && exit 1)
          [[ -n "$R2_ACCOUNT_ID" ]] || (echo "::error::R2_ACCOUNT_ID secret is missing" && exit 1)
          [[ -n "$R2_ACCESS_KEY_ID" ]] || (echo "::error::R2_ACCESS_KEY_ID secret is missing" && exit 1)
          [[ -n "$R2_SECRET_ACCESS_KEY" ]] || (echo "::error::R2_SECRET_ACCESS_KEY secret is missing" && exit 1)
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

      - name: Run USCG manufacturer-details extractor
        run: |
          if [[ -n "${{ github.event.inputs.lookback_days }}" ]]; then
            uv run recalls extract uscg_manufacturer_details --lookback-days "${{ github.event.inputs.lookback_days }}"
          else
            uv run recalls extract uscg_manufacturer_details
          fi
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
