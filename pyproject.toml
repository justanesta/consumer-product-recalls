[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "consumer-product-recalls"
version = "0.18.0"
description = "EtLT medallion pipeline for US federal consumer product recall data"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13.4,<3",
    "pydantic-settings>=2.14.1,<3",
    "sqlalchemy>=2.0.50,<3",
    "alembic>=1.13,<2",
    "httpx>=0.27,<1",
    "tenacity>=9.1.4,<10",
    "structlog>=25.5.0,<26",
    "typer>=0.26.7,<1",
    "dbt-core>=1.11.11,<2",
    "dbt-postgres>=1.8,<2",
    "boto3>=1.43.21,<2",
    # Phase 5d Step 2 — first HTML-scraping source (USCG). lxml is the
    # BeautifulSoup parser backend; both are required at runtime.
    "beautifulsoup4>=4.12,<5",
    "lxml>=6.1.1,<7",
    # Phase 6b — cross-source firm entity resolution. RapidFuzz powers the
    # edit-distance clustering in `recalls resolve-firms` (PR 6b.4); deterministic
    # name-cleaning stays in dbt-SQL macros (no in-DB fuzzy extension needed).
    "rapidfuzz>=3.10,<4",
]

[project.scripts]
recalls = "src.cli.main:app"

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10",
    "pytest-vcr>=1.0,<2",
    "pytest-cov>=7.1.0,<8",
    "respx>=0.21,<1",
    "vcrpy>=8.1.1,<9",
    "pyyaml>=6.0,<7",
    "ruff>=0.15.15,<1",
    "pyright>=1.1.410,<2",
    "pre-commit>=4.6.0,<5",
    "hypothesis>=6.155.1,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing"

[tool.ruff]
target-version = "py312"
line-length = 100
include = ["src/**/*.py", "tests/**/*.py", "scripts/**/*.py", "migrations/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TCH"]

[tool.ruff.lint.flake8-type-checking]
# Pydantic and pydantic-settings resolve annotations at runtime; their imports
# must not be moved to TYPE_CHECKING blocks.
runtime-evaluated-base-classes = ["pydantic.BaseModel", "pydantic_settings.BaseSettings"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
